name: Validate Push
on:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash
    working-directory: project

jobs:
  validate-all-and-build:
    runs-on: ubuntu-latest
    steps:
      # checkout code
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: project

      # checkout schema as xmllint can't https
      - name: Checkout schema repo
        uses: actions/checkout@v7
        with:
          repository: BetaMasaheft/Schema
          path: schema

      # Speed up apt-get installs
      - name: Disable man-db to make package install and removal faster
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo dpkg-reconfigure man-db

      - name: Install Test Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils ripgrep
      - name: Read bibliography pin
        id: bibpin
        run: |
          set -euo pipefail
          pin=$(grep -E '^[0-9a-f]{40}$' scripts/ci/pins/bibliography.sha | head -1)
          if [ -z "${pin}" ]; then
            echo "missing pin in scripts/ci/pins/bibliography.sha" >&2
            exit 1
          fi
          echo "sha=${pin}" >> "$GITHUB_OUTPUT"
      - name: Checkout bibliography (citations.xml)
        uses: actions/checkout@v7
        with:
          repository: BetaMasaheft/bibliography
          ref: ${{ steps.bibpin.outputs.sha }}
          path: bibliography
          sparse-checkout: citations.xml
          sparse-checkout-cone-mode: false
      - name: Checkout BetMas catalog artifacts
        uses: actions/checkout@v7
        with:
          repository: BetaMasaheft/BetMas
          ref: master
          path: betmas
          sparse-checkout: |
            db/apps/catalogs/bibl-exceptions.xml
            db/apps/catalogs/place-labels.xml
            scripts/place-labels
          sparse-checkout-cone-mode: false

      - name: Ensure all XML files are well formed
        run: |
          xmllint --noout \
            $(find . -type f -name '*.xml')

      - name: Refuse resurrected retired ids
        run: bash scripts/ci/check-retired-ids.sh --root .

      - name: HP5 deleted ⊆ retired
        run: |
          ./scripts/ci/check-deleted-subseteq-retired.sh \
            --deleted scripts/ci/fixtures/deleted.xml.snapshot \
            --retired config/retired-ids.xml \
            --exceptions scripts/ci/fixtures/hp5-exceptions.txt

      - name: Report overdue new/ stubs (warn only)
        run: bash scripts/ci/report-overdue-new-stubs.sh --root .
      - name: bm: bibliography ptr coverage
        run: |
          bash scripts/ci/check-bibl-ptrs.sh \
            --root . \
            --citations "${GITHUB_WORKSPACE}/bibliography/citations.xml" \
            --exceptions "${GITHUB_WORKSPACE}/betmas/db/apps/catalogs/bibl-exceptions.xml"
      - name: External place ref coverage (strict)
        run: |
          bash scripts/ci/check-place-refs.sh \
            --root . \
            --betmas "${GITHUB_WORKSPACE}/betmas"

      # DP: see #6
      # There are too many validation errors for this to be useful
      # validate all TEI-files (skip **/new/* — WIP stubs by convention;
      # well-formedness above still covers them)
      # - name: Validate files
      #   run: |
      #     find . -type f -name '*.xml' \
      #       -not -path '*/new/*' \
      #       -not -name 'build.xml' \
      #       -not -name 'repo.xml' \
      #       -not -name 'expath-pkg.xml' \
      #       -print0 | \
      #     xargs -0 \
      #     xmllint --noout --xinclude --nowarning 2>&1 \
      #     --relaxng ../schema/tei-betamesaheft-expanded.rng 2>&1 | \
      #     { grep 'fails to validate' || :; }

      - name: Build Expath Package
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 8
      - run: ant

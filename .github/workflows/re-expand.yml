name: Scheduled Re-expansion

# Hybrid expand + assemble. See expanded#11, expanded#25.
#
# workflow_dispatch ONLY. Each shard boots ghcr.io/betamasaheft/betamasaheft
# (app image: BetMasWeb + BetMasData + EthioStudies), expands one BetMasData
# collection path, uploads an artifact. Assemble merges into this repo;
# push_to_main gates notify-betmas. Image contents are asserted in BetMas bats.
#
# Pilot: collection=corpora or manuscripts/EMML/1-1000, push_to_main=false.
#          collection=manuscripts/EMML expands to all EMML L2 buckets.
# Full run: leave collection empty, shard_mode=hybrid (~193 jobs with
# heavy `{corpus}/new` reservation shards).
# matrix mode (~9 corpus shards) times out on works/persons/manuscripts.
# l1 mode (~214+ jobs) is uniform L1 everywhere (EMML → L2) plus reservation
# shards; hybrid keeps matrix grain for narratives/studies/authority-files/
# corpora and appends heavy */new jobs explicitly.
#
# The shard list skips `*/new` during the L1 walk, then hybrid/l1 append heavy
# `{corpus}/new` jobs (authority-files/new stays unscheduled). Assemble
# deletes a child directory the export does not contain, and keeps `new/`.
# On a full run, GET /api/expand/deletions names shard directories that
# this image's expanded collection has and its BetMasData does not.
# */new is not among them. A collection= pilot does not ask, and does
# not delete other shards. An older image cannot see a folder that was
# expanded only into a newer checkout, so it will not delete that folder.
# Overdue stubs drop when landed outside new/. IHA corpora re-expand from
# BetMasData. After assemble, check-retired-ids must pass before push_to_main.
#
# Every run, including a concrete collection= pilot, boots release-expanded
# once and GETs /api/expand/shards. That list is the collections inside the
# image, so a folder that exists only on live git HEAD cannot fail the matrix
# (expanded#40). The API applies mode grain, splits manuscripts/EMML to L2
# (a trailing slash or a leading ./ still splits), and refuses
# authority-files/new. Expand jobs boot the digest that list recorded.
# missing_only=true then drops paths already present in this checkout,
# selected from the image's full shard list (ahead of provenance filtering,
# so a shard whose corpus pin already matches provenance.json is still
# recovered when its directory is actually absent locally). Deletions still
# go through provenance filtering as usual. It is ignored when collection
# is set.
#
# A full run also reads provenance.json at the root of this checkout. A shard
# is skipped when that file already records the image's betmasweb pin, its
# bibliography pin, and the pin of the shard's corpus (the first path
# segment). Deletions under an unchanged corpus are skipped the same way.
# force=true ignores the file. The file is rewritten only in the push_to_main
# commit of a full run, so a dry run does not advance it.

on:
  workflow_dispatch:
    inputs:
      collection:
        description: >
          Optional path under BetMasData (e.g. works/1-1000 or
          manuscripts/EMML/1-1000). manuscripts/EMML expands to all L2
          buckets. Leave empty for full run (uses shard_mode).
        required: false
        type: string
        default: ""
      shard_mode:
        description: >
          hybrid = L1 for works/persons/manuscripts/places/institutions
          (manuscripts/EMML → L2) + matrix for narratives/studies/
          authority-files/corpora + heavy `{corpus}/new` (~193).
          l1 = one job per BetMasData L1 collection (~214+, EMML L2; skips
          `*/new` during walk, appends other reservation shards).
          matrix = one job per BetMasData corpus root (~9; large corpora
          still risk the expand-shard timeout, currently 300min).
        required: false
        type: choice
        options:
          - hybrid
          - l1
          - matrix
        default: hybrid
      push_to_main:
        description: >
          If true and assemble differs from checkout, commit and push to main.
          Only allowed when dispatching from main (not a feature branch).
          Blocked when allow_partial_assemble is true or any expand shard failed.
        required: false
        type: boolean
        default: false
      allow_partial_assemble:
        description: >
          Merge available shard artifacts even if some expand jobs failed.
          For dry-runs only; push_to_main is always blocked when this is true.
        required: false
        type: boolean
        default: false
      max_parallel:
        description: Max concurrent expand shard jobs (matrix strategy).
        required: false
        type: number
        default: 8
      missing_only:
        description: >
          After the image returns its shard list, keep only paths that are
          not already directories in this checkout. Ignored when collection
          is set.
        required: false
        type: boolean
        default: false
      force:
        description: >
          Re-expand every shard even when provenance.json already records
          these source pins. Use when an expand input the pins do not name
          has changed. Ignored when collection is set.
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # One list boot. The API owns grain, the EMML split, and authority-files/new.
  plan:
    uses: ./.github/workflows/reusable-expand-shard.yml
    with:
      mode: list
      shard_mode: ${{ inputs.shard_mode }}
      collection: ${{ inputs.collection }}
    secrets: inherit

  select:
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.pick.outputs.shards }}
      count: ${{ steps.pick.outputs.count }}
      image: ${{ steps.pick.outputs.image }}
      removed: ${{ steps.pick.outputs.removed }}
    steps:
      - name: Checkout expanded
        uses: actions/checkout@v7

      - name: Filter shard list
        id: pick
        env:
          SHARDS_JSON: ${{ needs.plan.outputs.shards }}
          REMOVED_JSON: ${{ needs.plan.outputs.removed }}
          SOURCES_JSON: ${{ needs.plan.outputs.sources }}
          IMAGE: ${{ needs.plan.outputs.image }}
          MISSING_ONLY: ${{ inputs.missing_only }}
          FORCE: ${{ inputs.force }}
          COLLECTION: ${{ inputs.collection }}
        run: |
          set -euo pipefail
          printf '%s\n' "${SHARDS_JSON}" | jq -er '.[]' > shards-in.txt
          printf '%s\n' "${REMOVED_JSON}" | jq -r '.[]' > removed-in.txt
          if [ -z "${COLLECTION}" ] && [ "${FORCE}" != "true" ]; then
            printf '%s\n' "${SOURCES_JSON}" > sources.json
            bash scripts/ci/filter-provenance.sh \
              --shards shards-in.txt \
              --removed removed-in.txt \
              --sources sources.json \
              --provenance provenance.json \
              --out-shards shards-kept.txt \
              --out-removed removed-kept.txt
          else
            cp shards-in.txt shards-kept.txt
            cp removed-in.txt removed-kept.txt
          fi
          if [ "${MISSING_ONLY}" = "true" ] && [ -z "${COLLECTION}" ]; then
            if [ -s shards-in.txt ]; then
              set +e
              bash scripts/ci/select-shards.sh \
                --shards shards-in.txt --root . --missing-only --out shards.txt
              status=$?
              set -e
              if [ "${status}" -eq 1 ]; then
                : > shards.txt
              elif [ "${status}" -ne 0 ]; then
                exit "${status}"
              fi
            else
              : > shards.txt
            fi
          elif [ "${MISSING_ONLY}" = "true" ]; then
            echo "::notice::missing_only is ignored when collection is set"
            cp shards-kept.txt shards.txt
          else
            cp shards-kept.txt shards.txt
          fi
          if [ -s shards.txt ]; then
            mapfile -t slices < shards.txt
            json=$(printf '%s\n' "${slices[@]}" | jq -R . | jq -s -c .)
            echo "count=${#slices[@]}" >> "${GITHUB_OUTPUT}"
          else
            json='[]'
            echo "count=0" >> "${GITHUB_OUTPUT}"
            echo "Every shard is already published from these source pins."
          fi
          echo "shards=${json}" >> "${GITHUB_OUTPUT}"
          removed_json=$(jq -R . < removed-kept.txt | jq -s -c .)
          echo "removed=${removed_json}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "Planned $(wc -l < shards.txt | tr -d ' ') shard(s):"
          cat shards.txt

      - name: Upload shard manifest
        uses: actions/upload-artifact@v7
        with:
          name: shards-manifest
          path: shards.txt
          retention-days: 5

  expand:
    needs: select
    if: needs.select.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        collection: ${{ fromJSON(needs.select.outputs.shards) }}
    uses: ./.github/workflows/reusable-expand-shard.yml
    with:
      mode: expand
      collection: ${{ matrix.collection }}
      image: ${{ needs.select.outputs.image }}
    secrets: inherit

  assemble:
    needs: [plan, select, expand]
    if: ${{ !cancelled() && needs.select.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Guard push_to_main requires main
        if: inputs.push_to_main == true
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::push_to_main only allowed when dispatching from main (got ${{ github.ref }})."
            exit 1
          fi

      - name: Guard push_to_main vs partial assemble
        if: inputs.push_to_main == true && inputs.allow_partial_assemble == true
        run: |
          echo "::error::push_to_main cannot be used with allow_partial_assemble."
          exit 1

      - name: Require full expand success for push
        if: inputs.push_to_main == true && needs.expand.result != 'success' && needs.expand.result != 'skipped'
        run: |
          echo "::error::One or more expand shards failed; fix or re-run before push_to_main."
          exit 1

      - name: Require full expand success for strict assemble
        if: inputs.allow_partial_assemble != true && needs.expand.result != 'success' && needs.expand.result != 'skipped'
        run: |
          echo "::error::One or more expand shards failed. Re-run failed shards or set allow_partial_assemble for dry-run merge."
          exit 1

      - name: Checkout expanded
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.push_to_main == true && 'main' || github.sha }}

      - name: Download shard manifest
        uses: actions/download-artifact@v8
        with:
          name: shards-manifest
          path: manifest

      - name: Download all shard artifacts
        if: needs.select.outputs.count != '0'
        uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          path: shards-in
          merge-multiple: true

      - name: Merge shards into working tree
        if: needs.select.outputs.count != '0'
        env:
          ALLOW_PARTIAL: ${{ inputs.allow_partial_assemble }}
        run: |
          set -euo pipefail
          args=(
            --manifest manifest/shards.txt
            --shards-in shards-in
            --repo-root .
          )
          if [ "${ALLOW_PARTIAL}" = "true" ]; then
            args+=(--allow-partial)
          fi
          if ! bash scripts/ci/assemble-shards.sh "${args[@]}"; then
            echo "::error::Assemble failed"
            exit 1
          fi

      - name: Remove shards the image no longer has
        if: success() && inputs.collection == '' && inputs.missing_only != true && inputs.allow_partial_assemble != true && (needs.expand.result == 'success' || needs.expand.result == 'skipped')
        env:
          REMOVED: ${{ needs.select.outputs.removed }}
        run: |
          set -euo pipefail
          printf '%s\n' "${REMOVED}" | jq -r '.[]' > removed.txt
          bash scripts/ci/prune-absent-shards.sh --paths removed.txt --root .

      - name: Install xmllint for retired-ids gate
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Refuse resurrected retired ids
        run: bash scripts/ci/check-retired-ids.sh --root .

      - name: Record published source pins
        if: inputs.push_to_main == true && inputs.collection == '' && inputs.missing_only != true && inputs.allow_partial_assemble != true && (needs.expand.result == 'success' || needs.expand.result == 'skipped')
        env:
          SOURCES: ${{ needs.plan.outputs.sources }}
        run: |
          set -euo pipefail
          printf '%s\n' "${SOURCES}" | jq -e -S 'select(.version == 1)' > provenance.json

      - name: Diff assembled snapshot
        id: diff
        run: |
          if git status --porcelain --untracked-files=normal \
            -- provenance.json \
               works persons places institutions narratives studies \
               authority-files manuscripts corpora \
            | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- \
              provenance.json \
              works persons places institutions narratives studies \
              authority-files manuscripts corpora | head -100
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No corpus diff - nothing to commit."
          fi

      - name: Commit and push re-expansion diff
        if: steps.diff.outputs.changed == 'true' && inputs.push_to_main == true
        run: |
          git config user.name "betmas-bot"
          git config user.email "betmas-bot@users.noreply.github.com"
          git add -- \
            provenance.json \
            works persons places institutions narratives studies \
            authority-files manuscripts corpora
          git commit -m "chore(expand): re-expansion snapshot (${{ inputs.shard_mode }})"
          git push origin HEAD:main

      - name: Skip push (changed but push_to_main=false)
        if: steps.diff.outputs.changed == 'true' && inputs.push_to_main != true
        run: |
          echo "::notice::Corpus differs after assemble, but push_to_main is false."

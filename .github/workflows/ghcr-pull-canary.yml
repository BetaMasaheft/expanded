name: GHCR pull canary

# Minimal proof that BOT_CONTAINER_PAT can pull the private app image.
# Same login pattern as BetMas bats / docker-build (betmas-bot + BOT_CONTAINER_PAT).

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BETMAS_IMAGE: ghcr.io/betamasaheft/betamasaheft:release-expanded
    steps:
      - name: Check secret is non-empty
        run: |
          if [ "${{ secrets.BOT_CONTAINER_PAT != '' }}" != "true" ]; then
            echo "::error::BOT_CONTAINER_PAT is empty or missing for this repo"
            exit 1
          fi
          echo "BOT_CONTAINER_PAT is set"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: betmas-bot
          password: ${{ secrets.BOT_CONTAINER_PAT }}

      - name: Pull app image
        run: docker pull "${BETMAS_IMAGE}"

      - name: Show image id
        run: docker image inspect "${BETMAS_IMAGE}" --format '{{.Id}} {{.RepoTags}}'

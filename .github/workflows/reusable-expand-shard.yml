name: Reusable expand shard

# Called by re-expand.yml.
# mode=list  — boot release-expanded, GET /api/expand/shards, emit shard JSON + image digest.
# mode=expand — boot that image (or the digest from list), makeExpand, xst get → artifact.
# See expanded#11, expanded#40.

on:
  workflow_call:
    inputs:
      mode:
        description: list (ask the image for shards) or expand (one collection)
        required: false
        type: string
        default: expand
      shard_mode:
        description: hybrid, l1, or matrix. Used when mode=list.
        required: false
        type: string
        default: hybrid
      collection:
        description: >
          Relative path under BetMasData. Required for expand.
          Optional filter for list (e.g. manuscripts/EMML).
        required: false
        type: string
        default: ""
      image:
        description: >
          Image ref or digest to boot. Empty uses release-expanded.
          Expand jobs should pass the digest recorded by mode=list.
        required: false
        type: string
        default: ""
    outputs:
      shards:
        description: JSON array of relative shard paths (list mode)
        value: ${{ jobs.expand-shard.outputs.shards }}
      removed:
        description: JSON array of shard paths to delete (list mode, full run only)
        value: ${{ jobs.expand-shard.outputs.removed }}
      image:
        description: Repo digest of the booted image (list mode)
        value: ${{ jobs.expand-shard.outputs.image }}
      sources:
        description: Normalized source pins from the image labels (list mode)
        value: ${{ jobs.expand-shard.outputs.sources }}
    secrets:
      BOT_CONTAINER_PAT:
        required: true

permissions:
  contents: read

env:
  BETMAS_IMAGE: ${{ inputs.image != '' && inputs.image || 'ghcr.io/betamasaheft/betamasaheft:release-expanded' }}

jobs:
  expand-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      shards: ${{ steps.list.outputs.shards }}
      removed: ${{ steps.list.outputs.removed }}
      image: ${{ steps.list.outputs.image }}
      sources: ${{ steps.list.outputs.sources }}
    steps:
      # App image is ~11GB+ layered; default runner disk is too tight.
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          build-mount-path: /var/lib/docker/
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          root-reserve-mb: 4096
          temp-reserve-mb: 1024

      - name: Restart docker
        run: sudo service docker restart

      # maximize-build-space may clear the workspace; checkout scripts after it.
      # Sparse: only scripts/ci (full expanded tree is multi-GB and not needed here).
      - name: Checkout expanded (scripts)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/ci
          sparse-checkout-cone-mode: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: betmas-bot
          password: ${{ secrets.BOT_CONTAINER_PAT }}

      - name: Pull app image
        id: pull
        run: |
          set -euo pipefail
          docker pull "${BETMAS_IMAGE}"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "${BETMAS_IMAGE}")
          if [ -z "${digest}" ] || [ "${digest}" = "<no value>" ]; then
            digest="${BETMAS_IMAGE}"
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Boot throwaway container
        run: |
          docker run -d --name betmas-expand-shard -p 8080:8080 "${{ steps.pull.outputs.digest }}"

      - name: Wait for eXist to start
        timeout-minutes: 5
        run: |
          until docker logs betmas-expand-shard 2>&1 | grep -q "Server has started"; do
            echo "Still waiting..."
            sleep 2
          done
          # Bounded settle — same idea as BetMasWeb exist.yml after boot.
          sleep 15

      - name: List shards from the image
        id: list
        if: inputs.mode == 'list'
        env:
          SHARD_MODE: ${{ inputs.shard_mode }}
          REL: ${{ inputs.collection }}
        run: |
          set -euo pipefail
          args=(--data-urlencode "mode=${SHARD_MODE}")
          rel="${REL#./}"
          if [ -n "${rel}" ]; then
            args+=(--data-urlencode "collection=${rel}")
          fi
          out=$(curl -fsS -u admin: --get --max-time 120 \
            "http://localhost:8080/exist/apps/BetMasWeb/api/expand/shards" \
            "${args[@]}")
          if ! printf '%s\n' "${out}" | jq -er '.shards[]' > shards.txt; then
            echo "::error::GET /api/expand/shards did not return a shards array"
            echo "${out}"
            exit 1
          fi
          echo "Image ${{ steps.pull.outputs.digest }} listed $(wc -l < shards.txt | tr -d ' ') shard(s):"
          cat shards.txt
          json=$(jq -R . < shards.txt | jq -s -c .)
          echo "shards=${json}" >> "${GITHUB_OUTPUT}"
          echo "image=${{ steps.pull.outputs.digest }}" >> "${GITHUB_OUTPUT}"
          # Deletions are the expanded tree frozen in this image against this
          # BetMasData. A collection= pilot does not ask: assemble only prunes
          # on a full run, and a pilot must not carry that side effect.
          if [ -n "${rel}" ]; then
            echo "removed=[]" >> "${GITHUB_OUTPUT}"
            echo "sources={}" >> "${GITHUB_OUTPUT}"
          else
            del=$(curl -fsS -u admin: --get --max-time 120 \
              "http://localhost:8080/exist/apps/BetMasWeb/api/expand/deletions" \
              --data-urlencode "mode=${SHARD_MODE}")
            if ! printf '%s\n' "${del}" | jq -e 'has("removed") and (.removed | type == "array")' >/dev/null; then
              echo "::error::GET /api/expand/deletions did not return a removed array"
              echo "${del}"
              exit 1
            fi
            printf '%s\n' "${del}" | jq -r '.removed[]' > removed.txt
            echo "Image named $(wc -l < removed.txt | tr -d ' ') deletion(s):"
            cat removed.txt
            removed_json=$(jq -R . < removed.txt | jq -s -c .)
            echo "removed=${removed_json}" >> "${GITHUB_OUTPUT}"
            docker image inspect --format '{{json .Config.Labels}}' \
              "${{ steps.pull.outputs.digest }}" > labels.json
            bash scripts/ci/image-sources.sh --labels labels.json > sources.json
            echo "sources=$(jq -c . < sources.json)" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set shard labels
        if: inputs.mode != 'list'
        env:
          REL: ${{ inputs.collection }}
        run: |
          set -euo pipefail
          if [ -z "${REL}" ]; then
            echo "::error::expand mode requires collection"
            exit 1
          fi
          safe=$(echo "${REL#./}" | tr '/' '-')
          echo "ARTIFACT_NAME=shard-${safe}" >> "${GITHUB_ENV}"

      - name: Expand collection
        if: inputs.mode != 'list'
        env:
          EXISTDB_SERVER: http://localhost:8080
          EXISTDB_USER: admin
          EXISTDB_PASS: ""
          REL: ${{ inputs.collection }}
        run: |
          set -euo pipefail
          rel="${REL#./}"
          col="/db/apps/BetMasData/${rel}"
          echo "Expanding ${col}"
          out=$(curl -fsS -u admin: --get --max-time 0 \
            "http://localhost:8080/exist/rest/db/apps/BetMasWeb/modules/makeExpand.xql" \
            --data-urlencode "collection=${col}")
          echo "${out}"
          if ! bash scripts/ci/check-makeExpand-output.sh "${out}"; then
            echo "::error::makeExpand refused or unexpected output for ${col}"
            exit 1
          fi

      - name: Export shard to artifact tree
        if: inputs.mode != 'list'
        env:
          EXISTDB_SERVER: http://localhost:8080
          EXISTDB_USER: admin
          EXISTDB_PASS: ""
          REL: ${{ inputs.collection }}
        run: |
          set -euo pipefail
          rel="${REL#./}"
          export_root="${RUNNER_TEMP}/expanded-export"
          artifact_root="${GITHUB_WORKSPACE}/shard-out"
          rm -rf "${export_root}" "${artifact_root}"
          mkdir -p "${export_root}" "${artifact_root}"

          npx --yes @existdb/xst@^4 get "/db/apps/expanded/${rel}" "${export_root}"
          if ! bash scripts/ci/stage-shard-export.sh \
            --rel "${rel}" \
            --export-root "${export_root}" \
            --artifact-root "${artifact_root}"; then
            echo "::error::Failed to stage export for ${rel}"
            exit 1
          fi

      - name: Upload shard artifact
        if: inputs.mode != 'list'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: shard-out/
          if-no-files-found: error
          retention-days: 5

      - name: Capture container logs on failure
        if: failure()
        run: |
          echo "Capturing container stdout/stderr..."
          docker logs betmas-expand-shard > exist.log 2>&1 || true

      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: exist-failed-log-${{ env.ARTIFACT_NAME || 'list' }}
          path: exist.log
          retention-days: 14

      - name: Tear down throwaway container
        if: always()
        run: docker rm -f betmas-expand-shard || true
